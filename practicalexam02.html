<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile Card</title>

<style>
    body{
        margin:0;
        padding:0;
        font-family: Arial, sans-serif;
        background:#f2f2f7;

        
        display:flex;
        justify-content:center;   
        align-items:center;       
        height:100vh;             
    }

    .card{
        width:330px;
        background:white;
        border-radius:15px;
        padding:20px;
        box-shadow:0 5px 15px rgba(0,0,0,0.1);

        
        display:flex;
        flex-direction:column;     
        align-items:center;        
        gap:15px;
    }

    .card img{
        width:120px;
        height:120px;
        border-radius:50%;
        object-fit:cover;
        border:4px solid #007bff;
    }

    .name{
        font-size:22px;
        font-weight:bold;
    }

    .course{
        color:#555;
        font-size:16px;
    }

    .details{
        display:flex;
        flex-direction:column;
        gap:8px;
        width:100%;
    }

    .row{
        display:flex;
        justify-content:space-between; 
        padding:10px;
        background:#f8f8ff;
        border-radius:8px;
    }
</style>
</head>

<body>

    <div class="card">
        <img src="https://via.placeholder.com/150" alt="Student Photo">

        <div class="name">Aarav Sharma</div>
        <div class="course">BSc. Computer Science - 3rd Year</div>

        <div class="details">
            <div class="row">
                <span>CGPA</span>
                <strong>8.7</strong>
            </div>

            <div class="row">
                <span>Projects</span>
                <strong>12</strong>
            </div>

            <div class="row">
                <span>Internships</span>
                <strong>3</strong>
            </div>
        </div>
    </div>

</body>
</html>
